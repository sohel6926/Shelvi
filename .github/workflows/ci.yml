# Runs the same checks as "CRM Check.command" on every push / pull request.
# NOT YET RUN: written on 21 Nov 2026 without access to GitHub — expect to fix small things on the first run.
name: CI
on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions

  web:
    runs-on: ubuntu-latest
    env:
      # Placeholders only so the build works; the real values live in web/.env.local (not committed).
      VITE_FIREBASE_API_KEY: ci
      VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci
      VITE_FIREBASE_STORAGE_BUCKET: ci.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
      VITE_FIREBASE_APP_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run lint
        working-directory: web
      - name: Docs and translations
        run: |
          python3 tools/check-code-map.py
          python3 tools/extract-i18n.py

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install test tools
        run: |
          mkdir -p "$HOME/rt-tests" && cd "$HOME/rt-tests"
          npm init -y >/dev/null
          npm i @firebase/rules-unit-testing@4 firebase@11 firebase-tools
      - name: Rules tests
        run: |
          cp tools/rules-test.mjs "$HOME/rt-tests/rules-test.mjs"
          "$HOME/rt-tests/node_modules/.bin/firebase" emulators:exec --project demo-suseela-rules --only firestore "node $HOME/rt-tests/rules-test.mjs"

  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --console=plain
